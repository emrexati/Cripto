<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marjin Sinyal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Marjin Sinyal">
<meta name="theme-color" content="#0b0e13">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b0e13;--card:#151a22;--card2:#1c2330;--border:#262f3d;--text:#e8ecf2;--dim:#8a95a8;--long:#16c784;--short:#ea3943;--accent:#f0b90b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 16px) env(safe-area-inset-left);min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:0}
.grow{flex:1;min-width:0}.ml8{margin-left:8px}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt16{margin-top:16px}
.small{color:var(--dim);font-size:12px}
.center{text-align:center;padding:6px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(11,14,19,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.sub{color:var(--dim);font-size:12px;margin-top:2px}
.icon{width:38px;height:38px;border-radius:19px;background:var(--card);font-size:22px;line-height:38px;text-align:center;flex:none}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.badges{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 0}
.badge{border:1px solid var(--c);color:var(--c);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600}
.tabs{display:flex;margin:12px 12px 4px;background:var(--card);border-radius:10px;padding:3px}
.tabs button{flex:1;padding:9px 0;border-radius:8px;color:var(--dim);font-weight:600;font-size:13px}
.tabs button.on{background:var(--card2);color:var(--text)}
.list{padding:8px 12px}
.row{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;gap:10px}
.row.active{border-color:var(--c)}
.row:active{opacity:.7}
.left{text-align:left}
.right{display:flex;flex-direction:column;align-items:flex-end}
.sym{font-size:17px;font-weight:700;display:flex;align-items:center;gap:5px}
.new{background:var(--accent);color:#000;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.price.big{font-size:22px;margin-top:6px}
.pill{margin-top:6px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:2px 10px;font-weight:800;font-size:13px;letter-spacing:.5px}
.meter{width:70px;height:4px;background:var(--card2);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:4px;background:var(--c)}
.empty{text-align:center;color:var(--dim);margin-top:40px}
.error{margin:12px;padding:12px;background:#2a1215;border:1px solid var(--short);border-radius:10px;color:#ff9aa0}
.loader{width:36px;height:36px;margin:40px auto;border:3px solid var(--card2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.pad{padding:14px}
.hero{text-align:center;padding:18px;border:1.5px solid var(--c);border-radius:14px;background:var(--card);margin-bottom:12px}
.hero .sig{font-size:34px;font-weight:900;letter-spacing:1px;color:var(--c)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.chart{width:100%;height:auto;display:block;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
.kv span{color:var(--dim)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
hr{border:0;height:1px;background:var(--border);margin:8px 0}
.warn{color:var(--accent);font-size:12px}
.bul{list-style:none;margin:0;padding:0}
.bul li{position:relative;padding:3px 0 3px 18px;font-size:14px}
.bul li:before{content:"●";position:absolute;left:0;color:var(--c)}
.cta{display:block;width:100%;text-align:center;background:var(--accent);color:#000;font-weight:800;border-radius:12px;padding:14px;text-decoration:none;font-size:15px}
.ghost{display:block;width:100%;margin-top:10px;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--card2);font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{padding:8px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--border);font-weight:600;font-size:13px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#000}
input{width:100%;margin-top:8px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:16px}
.disc{color:var(--dim);font-size:12px;text-align:center;padding:8px 20px 20px;line-height:1.45}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;background:var(--accent);color:#000;font-weight:700;padding:12px 14px;border-radius:12px;transform:translateY(-140%);transition:transform .3s}
.toast.show{transform:none}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 12px 0}
.stats div{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--dim)}
.mx{margin:0 12px 12px}
.setup{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:14px;padding:14px;margin-bottom:12px}
.setup.done{opacity:.55}
.setup .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.coin{font-size:19px;font-weight:800;display:flex;align-items:center;gap:6px}
.coin span{font-size:12px;color:var(--dim);font-weight:600}
.coin em{font-style:normal;background:var(--accent);color:#000;font-size:10px;font-weight:800;padding:1px 6px;border-radius:4px}
.coin em.gray{background:var(--card2);color:var(--dim)}
.status{font-size:11px;font-weight:700;color:var(--s);border:1px solid var(--s);border-radius:10px;padding:3px 8px;text-align:right}
.order{display:flex;gap:12px;align-items:center;margin:12px 0 10px}
.side{writing-mode:horizontal-tb;background:var(--c);color:#000;font-weight:900;font-size:15px;letter-spacing:.5px;border-radius:10px;padding:14px 10px;min-width:74px;text-align:center}
.what{flex:1;min-width:0}
.lbl{font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.4px}
.entry{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lv{background:var(--card2);border-radius:10px;padding:8px 6px;text-align:center}
.lv span{display:block;font-size:10px;font-weight:700;letter-spacing:.3px;color:var(--dim)}
.lv b{display:block;font-size:14px;font-variant-numeric:tabular-nums;margin:2px 0}
.lv i{font-style:normal;font-size:11px;font-weight:600}
.lv.sl b,.lv.sl i{color:var(--short)}
.lv.tp b,.lv.tp i{color:var(--long)}
.pos{font-size:12px;color:var(--dim);margin-top:10px;text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btns button{padding:10px;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-weight:600;font-size:13px}
.how ol{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--dim)}
.how li{margin:4px 0}
.how b{color:var(--text)}

.setup.taken{box-shadow:0 0 0 1px var(--c) inset}
.coin em.mine{background:#5aa9ff;color:#000}
.takebtn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:10px;background:var(--c);color:#000;font-weight:800;font-size:15px}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.day{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:14px 2px 6px}
.hrow{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--r);border-radius:12px;margin-bottom:8px}
.hrow summary{display:flex;align-items:center;gap:10px;padding:10px 12px;list-style:none;cursor:pointer}
.hrow summary::-webkit-details-marker{display:none}
.hl{flex:1;min-width:0}
.hl b{font-size:16px}
.hs{font-size:12px;font-weight:800;color:var(--c)}
.hl em{font-style:normal;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:4px;background:var(--card2);color:var(--dim)}
.hl em.mine{background:#5aa9ff;color:#000}
.hr{text-align:right}
.res{font-size:12px;font-weight:700;color:var(--r)}
.rr{font-size:15px;font-weight:800;color:var(--r);font-variant-numeric:tabular-nums}
.hd{padding:0 12px 10px;border-top:1px solid var(--border)}
.total{padding:10px 14px 0;font-size:14px}
</style>
</head>
