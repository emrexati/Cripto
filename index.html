<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Marjin Sinyal">

<meta name="robots" content="noindex, nofollow">

<style>
:root{--bg:#0b0e13;--card:#151a22;--card2:#1c2330;--border:#262f3d;--text:#e8ecf2;--dim:#8a95a8;--long:#16c784;--short:#ea3943;--accent:#f0b90b}

html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:16px;margin:0 0 8px}
h3{font-size:14px;margin:0}

.sub{color:var(--dim);font-size:12px;margin-top:2px}

.list{padding:8px 12px}
.row{display:flex;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;gap:10px}
.row.active{border-color:var(--c)}
.row:active{opacity:.7}
.left{text-align:left}
.right{display:flex;flex-direction:column;align-items:flex-end}
.sym{font-size:17px;font-weight:700;display:flex;align-items:center;gap:5px}
.new{background:var(--accent);color:#000;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px}
.price{font-weight:600;font-variant-numeric:tabular-nums}
.price.big{font-size:22px;margin-top:6px}
.pill{margin-top:6px;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:2px 10px;font-weight:800;font-size:13px;letter-spacing:.5px}
.meter{width:70px;height:4px;background:var(--card2);border-radius:2px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:4px;background:var(--c)}
.empty{text-align:center;color:var(--dim);margin-top:40px}
.error{margin:12px;padding:12px;background:#2a1215;border:1px solid var(--short);border-radius:10px;color:#ff9aa0}
.loader{width:36px;height:36px;margin:40px auto;border:3px solid var(--card2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
.pad{padding:14px}
.hero{text-align:center;padding:18px;border:1.5px solid var(--c);border-radius:14px;background:var(--card);margin-bottom:12px}
.hero .sig{font-size:34px;font-weight:900;letter-spacing:1px;color:var(--c)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
.chart{width:100%;height:auto;display:block;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
.kv span{color:var(--dim)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
hr{border:0;height:1px;background:var(--border);margin:8px 0}
.warn{color:var(--accent);font-size:12px}
.bul{list-style:none;margin:0;padding:0}
.bul li{position:relative;padding:3px 0 3px 18px;font-size:14px}
.bul li:before{content:"●";position:absolute;left:0;color:var(--c)}
.cta{display:block;width:100%;text-align:center;background:var(--accent);color:#000;font-weight:800;border-radius:12px;padding:14px;text-decoration:none;font-size:15px}
.ghost{display:block;width:100%;margin-top:10px;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--card2);font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{padding:8px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--border);font-weight:600;font-size:13px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#000}
input{width:100%;margin-top:8px;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:16px}
.disc{color:var(--dim);font-size:12px;text-align:center;padding:8px 20px 20px;line-height:1.45}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:20;background:var(--accent);color:#000;font-weight:700;padding:12px 14px;border-radius:12px;transform:translateY(-140%);transition:transform .3s}
.toast.show{transform:none}
</style>
</head>
